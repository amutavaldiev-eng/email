{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<div class="container">

    <h1>Edit Task</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Task Title</label>
        <input
            type="text"
            name="title"
            value="{{ task.title }}"
            required
        >
        <label>Description</label>

        <textarea
            name="caption"
            required
        >{{ task.caption }}</textarea>

        <button type="submit" class="btn edit-btn">
            Update Task
        </button>

        <a href="{% url 'tasks' %}" class="btn cancel-btn">
            Cancel
        </a>
        </a>
            <a href="{% url 'home' %}" class="btn ">
            Back home
        </a>

    </form>

</div>

</body>
</html>
